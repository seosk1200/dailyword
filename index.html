<title>오늘의 단어</title>
<style>
:root{--bg:#1a1a1c;--tx:#fff;--tile:#3a3a3d;--key:#3a3a3d;--g:#8fdc8f;--y:#fbe36a;--gr:#6b6b6f;--sub:#9a9aa0;--card:#26262a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.w{max-width:440px;margin:0 auto;padding:12px 14px 24px}
h1{text-align:center;font-size:22px;margin:6px 0}
.top{display:flex;justify-content:space-between;color:var(--sub);font-size:14px;margin-bottom:8px}
#grid{display:grid;grid-template-rows:repeat(5,1fr);gap:7px;margin:10px auto;width:min(330px,100%)}
.r{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.t{aspect-ratio:1;border-radius:12px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600}
.t.g{background:var(--g);color:#111}.t.y{background:var(--y);color:#111}.t.x{background:var(--gr);color:#eee}
.shake{animation:s .3s}@keyframes s{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#msg{text-align:center;min-height:22px;color:var(--y);font-size:14px}
.kr{display:flex;gap:5px;justify-content:center;margin:5px 0}
.k{flex:1;max-width:40px;height:46px;border:0;border-radius:8px;background:var(--key);color:var(--tx);font-size:17px;font-weight:600}
.k.g{background:var(--g);color:#111}.k.y{background:var(--y);color:#111}.k.x{background:var(--gr);opacity:.5}
.k.w2{max-width:60px}
#go{width:100%;height:50px;border:0;border-radius:14px;background:var(--y);color:#111;font-size:17px;font-weight:700;margin-top:8px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:14px}
.card h2{font-size:16px;margin:0 0 4px}.card small{color:var(--sub)}
ol{padding:0;margin:8px 0 0;list-style:none}li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #8883}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px}
#ov .b{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:340px;text-align:center}
#ov input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #8886;background:var(--bg);color:var(--tx);font-size:16px;margin:10px 0}

const KEYS=[["ㅂ","ㅈ","ㄷ","ㄱ","ㅅ","ㅛ","ㅕ","ㅑ","⌫"],["ㅁ","ㄴ","ㅇ","ㄹ","ㅎ","ㅗ","ㅓ","ㅏ","ㅣ"],["ㅋ","ㅌ","ㅊ","ㅍ","ㅠ","ㅜ","ㅡ"]];
let score=0,row=0,cur=[],ans=[],ansW="",used=[],over=false,ksta={};
const $=id=>document.getElementById(id);
function msg(t){$("msg").textContent=t;if(t)setTimeout(()=>{if($("msg").textContent===t)$("msg").textContent=""},1800)}
function build(){const g=$("grid");g.innerHTML="";for(let r=0;r<5;r++){const d=document.createElement("div");d.className="r";for(let c=0;c<5;c++){const t=document.createElement("div");t.className="t";d.appendChild(t)}g.appendChild(d)}
 const k=$("kb");k.innerHTML="";KEYS.forEach(r=>{const d=document.createElement("div");d.className="kr";r.forEach(c=>{const b=document.createElement("button");b.className="k"+(c==="⌫"?" w2":"");b.textContent=c;b.dataset.k=c;b.onclick=()=>{press(c);b.blur()};d.appendChild(b)});k.appendChild(d)})}
function paint(){const rows=$("grid").children;for(let r=0;r<5;r++){if(r===row&&!over)[...rows[r].children].forEach((t,i)=>t.textContent=cur[i]||"")}$("sc").textContent=score;$("try").textContent=`남은 기회 ${5-row}`}
function newWord(){let w;do{w=WORDS[Math.floor(Math.random()*WORDS.length)]}while(used.includes(w)&&used.length<WORDS.length);used.push(w);ansW=w;ans=jamo(w);row=0;cur=[];ksta={};build();paint()}
function press(c){if(over)return;if(c==="⌫"){cur.pop()}else if(cur.length<5){cur.push(c)}paint()}
function grade(g){const res=Array(5).fill("x"),left={};ans.forEach((a,i)=>{if(g[i]===a)res[i]="g";else left[a]=(left[a]||0)+1});
 g.forEach((x,i)=>{if(res[i]!=="g"&&left[x]>0){res[i]="y";left[x]--}});return res}
function submit(){if(over)return;if(cur.length<5){msg("5칸을 모두 채워주세요");return shake()}
 // 입력 자모가 사전 단어의 분해와 일치하는지 확인
 const kk=cur.join("");const ok=OK.has(kk)||(DICT&&DICT.has(kk));if(!ok){msg("사전에 없는 단어예요");return shake()}
 const res=grade(cur),tr=$("grid").children[row];
 res.forEach((s,i)=>{tr.children[i].className="t "+s;const k=cur[i],p={g:3,y:2,x:1};if(!ksta[k]||p[s]>p[ksta[k]])ksta[k]=s});
 document.querySelectorAll(".k").forEach(b=>{const s=ksta[b.dataset.k];b.className="k"+(b.dataset.k==="⌫"?" w2":"")+(s?" "+s:"")});
 if(res.every(s=>s==="g")){score++;msg(`정답! +1점 (${ansW})`);setTimeout(newWord,1100);return}
 row++;cur=[];if(row>=5){end()}else paint()}
function shake(){const r=$("grid").children[row];r.classList.remove("shake");void r.offsetWidth;r.classList.add("shake")}
// ---------- 랭킹 (공유 db + 매시 정각 갱신) ----------
// ▼ Firebase Realtime Database 주소를 여기에 넣으세요 (끝에 / 없이). 예: https://내프로젝트-default-rtdb.firebaseio.com
const DB_URL="https://dailyword-d3df9-default-rtdb.firebaseio.com";
// ▼ 관리자 삭제 기능용: Firebase 프로젝트 설정의 웹 API 키, 그리고 관리자 계정 이메일
const API_KEY="AIzaSyDIdDGgfsejVl1v0w-hs7JGkQEclTb2V28",ADMIN_EMAIL="0L9ljWpvujNPSIk8KwQbACsMINl1";
let admin=false,token="";
let db=null,board=[],lastHour=-1;
const LS="todayword_rank";
async function fetchBoard(){let list=[];try{if(DB_URL){const r=await fetch(DB_URL+"/ranking.json?orderBy=%22score%22&limitToLast=50");if(!r.ok)throw 0;list=Object.entries(await r.json()||{}).filter(([k,v])=>v&&typeof v==="object").map(([k,v])=>({...v,id:k}))}else if(db){const q=await db.collection("ranking").orderBy("score","desc").limit(50).get();list=q.docs.map(d=>d.data()).filter(Boolean)}else{list=JSON.parse(localStorage.getItem(LS)||"[]")}}catch(e){try{list=JSON.parse(localStorage.getItem(LS)||"[]")}catch(_){}}
 list.sort((a,b)=>b.score-a.score||(a.ts||0)-(b.ts||0));return list.slice(0,5)}
function render(){const o=$("rk");o.innerHTML="";if(!board.length)o.innerHTML='<li><span>아직 기록이 없어요</span></li>';board.forEach((e,i)=>{const l=document.createElement("li");l.innerHTML=`<span>${i+1}. </span><span style="flex:1;padding-left:6px"></span><b>${e.score}점</b>`;l.children[1].textContent=e.name;if(admin){const x=document.createElement("button");x.textContent="삭제";x.style.cssText="margin-left:8px;border:0;border-radius:6px;padding:3px 8px;background:#e5534b;color:#fff;font-size:12px";x.onclick=()=>delEntry(e);l.appendChild(x)}o.appendChild(l)});const n=new Date();$("upd").textContent=`${String(n.getHours()).padStart(2,"0")}:00 기준 · 매시 정각에 갱신${(db||DB_URL)?"":" (이 기기 전용)"}`}
async function refresh(){board=await fetchBoard();lastHour=new Date().getHours();render()}
setInterval(()=>{if(new Date().getHours()!==lastHour)refresh()},15000);
async function end(){over=true;paint();const fresh=await fetchBoard();const q=score>0&&(fresh.length<5||score>fresh[fresh.length-1].score);
 $("ot").textContent="게임 종료";$("op").textContent=`정답은 "${ansW}" · 최종 점수 ${score}점`+(q?" · 🎉 TOP 5 진입!":"");$("nm").style.display=q?"block":"none";$("ov").style.display="flex"}
$("done").onclick=async()=>{const nm=$("name").value.trim();if(!nm)return;const e={name:nm,score,ts:Date.now()};$("done").disabled=true;
 try{if(DB_URL){const r=await fetch(DB_URL+"/ranking.json",{method:"POST",body:JSON.stringify(e)});if(!r.ok)throw 0}else if(db)await db.collection("ranking").add(e);else{const l=JSON.parse(localStorage.getItem(LS)||"[]");l.push(e);localStorage.setItem(LS,JSON.stringify(l))}}catch(err){$("op").textContent="저장 실패: 인터넷 연결이나 서버 설정을 확인해 주세요"}
 await refresh();$("nm").style.display="none";$("done").disabled=false;$("name").value="";$("op").textContent="랭킹에 등록되었어요!"};
$("again").onclick=()=>{$("ov").style.display="none";over=false;score=0;used=[];newWord()};
$("go").onclick=submit;
const KM={KeyQ:"ㅂ",KeyW:"ㅈ",KeyE:"ㄷ",KeyR:"ㄱ",KeyT:"ㅅ",KeyY:"ㅛ",KeyU:"ㅕ",KeyI:"ㅑ",KeyA:"ㅁ",KeyS:"ㄴ",KeyD:"ㅇ",KeyF:"ㄹ",KeyG:"ㅎ",KeyH:"ㅗ",KeyJ:"ㅓ",KeyK:"ㅏ",KeyL:"ㅣ",KeyZ:"ㅋ",KeyX:"ㅌ",KeyC:"ㅊ",KeyV:"ㅍ",KeyB:"ㅠ",KeyN:"ㅜ",KeyM:"ㅡ"};
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||e.ctrlKey||e.metaKey||e.altKey)return;if(e.code==="Enter"||e.code==="NumpadEnter"){e.preventDefault();submit()}else if(e.code==="Backspace"){e.preventDefault();press("⌫")}else if(KM[e.code]&&!(e.shiftKey&&"QWERTOP".includes(e.code[3]))){press(KM[e.code])}});
$("adm").addEventListener("change",async()=>{const v=$("adm").value.trim();$("adm").value="";if(v!=="관리자모드")return;
 if(!DB_URL){admin=true;render();return}
 const pw=prompt("관리자 비밀번호");if(!pw)return;
 try{const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+API_KEY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:ADMIN_EMAIL,password:pw,returnSecureToken:true})});const o=await r.json();if(!r.ok)throw 0;token=o.idToken;admin=true;render();alert("관리자 모드가 켜졌어요")}catch(e){alert("로그인 실패: 비밀번호나 설정을 확인해 주세요")}});
async function delEntry(e){if(!confirm(`"${e.name}" ${e.score}점 기록을 삭제할까요?`))return;
 try{if(DB_URL){const r=await fetch(DB_URL+"/ranking/"+e.id+".json?auth="+token,{method:"DELETE"});if(!r.ok)throw 0}else{const l=JSON.parse(localStorage.getItem(LS)||"[]").filter(x=>x.ts!==e.ts);localStorage.setItem(LS,JSON.stringify(l))}}
 catch(err){admin=false;token="";render();alert("삭제 실패: 권한이 없거나 로그인이 만료됐어요. '관리자모드'를 다시 입력해 주세요");return}
 await refresh()}

build();newWord();render();
(async()=>{try{db=await claude.use("db")}catch(e){db=null}refresh()})();
</script></body></html>
